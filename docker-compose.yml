version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: jobtrail-postgres
    restart: always
    environment:
      POSTGRES_USER: jobtrail_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local_dev_password}
      POSTGRES_DB: jobtrail_db
    ports:
      - "5433:5432"
    volumes:
      - jobtrail-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtrail_user -d jobtrail_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobtrail-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/jobtrail_db
      - SPRING_DATASOURCE_USERNAME=jobtrail_user
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-local_dev_password}
      - JWT_SECRET=${JWT_SECRET:-generate_a_secure_random_string_for_local_dev}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jobtrail-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080/api
    depends_on:
      - backend

volumes:
  jobtrail-pgdata: