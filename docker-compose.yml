

services:
  db:
    image: postgres:15-alpine
    container_name: jobtrail-postgres
    restart: always
    environment:
      POSTGRES_USER: jobtrail_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local_dev_password}
      POSTGRES_DB: jobtrail_db
    ports:
      - "5433:5432"
    volumes:
      - jobtrail-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtrail_user -d jobtrail_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  jobtrail-pgdata: