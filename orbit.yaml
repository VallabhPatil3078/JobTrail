version: 1

tasks:
  compile:
    command: "./mvnw compile"
    working_dir: "backend"
    trigger_paths: ["backend/src/main/**", "backend/pom.xml"]

  test:
    command: "./mvnw test"
    depends_on: ["compile"]
    working_dir: "backend"
    trigger_paths: ["backend/src/**", "backend/pom.xml"]

  frontend_build:
    command: "npm run build"
    working_dir: "frontend"
    trigger_paths: ["frontend/src/**", "frontend/package.json", "frontend/vite.config.ts", "frontend/tsconfig*.json", "frontend/components.json"]
