version: 1

tasks:
  compile:
    command: "mvn compile"
    working_dir: "backend"
    trigger_paths: ["backend/src/main/**", "backend/pom.xml"]

  test:
    command: "mvn test"
    depends_on: ["compile"]
    working_dir: "backend"
    trigger_paths: ["backend/src/**", "backend/pom.xml"]

  frontend_lint:
    command: "npm run lint"
    working_dir: "frontend"
    trigger_paths: ["frontend/src/**", "frontend/package.json", "frontend/tsconfig*.json"]

  frontend_test:
    command: "npm run test"
    depends_on: ["frontend_lint"]
    working_dir: "frontend"
    trigger_paths: ["frontend/src/**", "frontend/package.json", "frontend/vitest.config.ts", "frontend/src/test/**"]

  frontend_build:
    command: "npm run build"
    depends_on: ["frontend_test"]
    working_dir: "frontend"
    trigger_paths: ["frontend/src/**", "frontend/package.json", "frontend/vite.config.ts", "frontend/tsconfig*.json", "frontend/components.json"]
